name: Feature request
description: Suggest something MultiClaude should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, findings, or open questions.
