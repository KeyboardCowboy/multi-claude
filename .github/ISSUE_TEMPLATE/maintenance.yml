name: Maintenance task
description: Upkeep that isn't a bug or a feature, such as dependencies, builds, docs, or verification.
labels: [maintenance]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs doing and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
