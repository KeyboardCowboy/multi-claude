<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MultiClaude app icon: three overlapping profile tiles: two app swatch colors plus Claude orange in front.
       Rebuild the .icns with `npm run icon` after editing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F8FA"/>
      <stop offset="1" stop-color="#E3E6EC"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#10131A" flood-opacity="0.28"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824x824 body centered on the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>

  <!-- Back to front: Berry, Teal, Claude orange -->
  <g filter="url(#shadow)">
    <rect x="232" y="232" width="380" height="380" rx="84" fill="#B3315F"/>
    <rect x="232" y="232" width="380" height="380" rx="84" fill="url(#sheen)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="322" y="322" width="380" height="380" rx="84" fill="#0F7F76"/>
    <rect x="322" y="322" width="380" height="380" rx="84" fill="url(#sheen)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="412" y="412" width="380" height="380" rx="84" fill="#D97757"/>
    <rect x="412" y="412" width="380" height="380" rx="84" fill="url(#sheen)"/>
  </g>
</svg>
